# Current square-arena profile. Fresh training starts new weights; resume restores a checkpoint.
# The recorded experiment changed profiles during training; see README_CURRICULUM.md.
total_timesteps: 700000
rollout_steps: 2048
seed: 42
reset_seed_base: 10000
device: cuda
output_root: runs/ppo_curriculum
checkpoint_every_updates: 10
log_every_updates: 1
anneal_learning_rate: false
curriculum:
  enabled: true
  start_level: 0
  max_level: 2
  promotion_window: 100
  minimum_episodes: 100
  success_threshold: 0.8
  validation_episodes: 10
  validation_success_threshold: 0.8
  validation_retry_episodes: 25
  detour_practice: true
  detour_success_threshold: 0.8
  corner_practice_probability: 0.3
  mirror_training: true
ppo:
  learning_rate: 0.0001
  discount_factor: 0.99
  gae_lambda: 0.95
  clip_coefficient: 0.2
  value_clip_coefficient: 0.2
  entropy_coefficient: 0.001
  value_loss_coefficient: 0.5
  max_gradient_norm: 0.5
  update_epochs: 10
  minibatch_size: 64
  target_kl: 0.03
  adam_epsilon: 1.0e-05
reward:
  safety_distance_m: 0.5
  near_obstacle_penalty_scale: 0.2
  progress_mode: detour_potential
  discount_factor: 0.99
  detour_clearance_m: 0.3
  braking_penalty_scale: 1.0
action:
  stop_fraction: 0.15
